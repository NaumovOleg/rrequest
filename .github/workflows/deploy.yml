name: deploy

# On push to main or development:
#   (1) deploy the AWS backend (CDK), then
#   (2) bump the extension version from Conventional Commits and publish it.
# Job 2 runs only after job 1 succeeds.
#
# Secrets and variables are read from a GitHub *Environment*, chosen by branch:
#   main        -> environment "production"  -> STABLE Marketplace release
#   development -> environment "development"  -> PRE-RELEASE Marketplace build
# Each environment holds its own AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
# VSCE_PAT secrets and AWS_REGION / AWS_ACCOUNT_ID / GOOGLE_CLIENT_ID /
# GOOGLE_REDIRECT_URI variables, so dev and prod deploy to their own targets.
on:
  push:
    branches: [main, development]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version-bump tag

jobs:
  deploy-api:
    name: Deploy backend to AWS
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
      # Secret VALUES baked into the Lambda env at deploy (from env secrets).
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install server deps (+ esbuild for Lambda bundling)
        working-directory: server
        run: |
          npm ci
          npm i --no-save esbuild

      - name: CDK deploy RrequestStack
        working-directory: server/infra
        run: npx cdk deploy RrequestStack --require-approval never

  publish-extension:
    name: Publish extension to Marketplace
    runs-on: ubuntu-latest
    needs: deploy-api # AWS first, then the extension
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the Conventional-Commit bump + tag

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps + build
        run: |
          npm ci
          npm run build

      - name: Determine semver bump (Conventional Commits)
        id: bump
        run: echo "level=$(npx --yes conventional-recommended-bump -p angular 2>/dev/null || echo patch)" >> "$GITHUB_OUTPUT"

      # main -> stable release
      - name: Publish stable to Marketplace
        if: github.ref_name == 'main'
        run: npx --yes @vscode/vsce publish ${{ steps.bump.outputs.level }} -p "$VSCE_PAT" --no-git-tag-version
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # development -> pre-release (unstable) build
      - name: Publish pre-release to Marketplace
        if: github.ref_name != 'main'
        run: npx --yes @vscode/vsce publish ${{ steps.bump.outputs.level }} --pre-release -p "$VSCE_PAT" --no-git-tag-version
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Tag the release
        run: |
          git config user.email "ci@rrequest.dev"
          git config user.name "rrequest ci"
          NEW=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG="v$NEW"
          else
            TAG="v$NEW-pre.${{ github.run_number }}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
