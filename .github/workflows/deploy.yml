name: deploy

# Push to development -> deploy the AWS backend on EVERY push (dev stack), no release.
# Push to main        -> ONLY when the version was bumped (v<version> not yet tagged):
#                        deploy the AWS backend (prod stack) THEN publish the extension.
#                        A main push that didn't bump the version does nothing.
# The version is chosen by the developer via changesets (yarn changeset ->
# yarn changeset:version), committed to package.json; CI publishes + tags it.
#
# Secrets and variables are read from a GitHub *Environment*, chosen by branch:
#   main        -> environment "production"   (STAGE=production,  stack RrequestStack)
#   development -> environment "development"   (STAGE=development, stack DevelopmentRrequestStack)
# Each environment holds its own AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
# VSCE_PAT secrets and AWS_REGION / AWS_ACCOUNT_ID / GOOGLE_CLIENT_ID /
# GOOGLE_REDIRECT_URI / GOOGLE_CLIENT_SECRET / JWT_SECRET / TOKEN_ENC_KEY.
on:
  push:
    branches: [main, development]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version-bump tag (main only)

jobs:
  deploy-api:
    name: Deploy backend to AWS
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      STAGE: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
      # Secret VALUES baked into the Lambda env at deploy (from env secrets).
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      # development: deploy on every push. main: deploy only when the version
      # was bumped (v<version> not yet tagged) — same release trigger as the
      # extension publish, so a docs/refactor push to main redeploys nothing.
      - name: Decide whether to deploy
        id: gate
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "development branch — always deploy."
          else
            VER=$(node -p "require('./package.json').version")
            git fetch --tags --quiet
            if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "main: v$VER already tagged — skip AWS deploy."
            else
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "main: v$VER not yet released — deploy."
            fi
          fi

      - name: Configure AWS credentials
        if: steps.gate.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # One node_modules at the repo root now carries the extension, server and
      # infra (incl. aws-cdk + esbuild for Lambda bundling).
      - name: Install deps
        if: steps.gate.outputs.deploy == 'true'
        run: yarn install --frozen-lockfile

      # STAGE selects the stack (RrequestStack / DevelopmentRrequestStack); --all
      # deploys whichever single stack bin/app.ts synthesizes for this STAGE.
      - name: CDK deploy
        if: steps.gate.outputs.deploy == 'true'
        working-directory: infra
        run: npx cdk deploy --all --require-approval never

  # Only main publishes the extension. A development push stops after deploy-api.
  publish-extension:
    name: Publish extension to Marketplace
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.ref_name == 'main'
    environment: production
    env:
      # Baked into the build (esbuild define) as the default sync backend URL.
      # Set the SYNC_SERVER_URL variable on the "production" environment.
      SYNC_SERVER_URL: ${{ vars.SYNC_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need existing tags to skip an already-published version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install deps + build
        run: |
          yarn install --frozen-lockfile
          yarn build

      # The version is chosen by the developer, not CI: add a changeset
      # (`yarn changeset`), apply it (`yarn changeset:version`), and commit
      # the bumped package.json. CI publishes exactly that version and tags it —
      # it never bumps the version itself.
      - name: Read package version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A push to main that didn't change the version (docs, refactors, etc.)
      # must not re-publish or re-tag. If v<version> already exists, skip.
      - name: Skip if this version is already tagged
        id: tagged
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v${{ steps.ver.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.ver.outputs.version }} already tagged — nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Marketplace
        if: steps.tagged.outputs.exists == 'false'
        run: npx --yes @vscode/vsce publish -p "$VSCE_PAT" --no-git-tag-version
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Tag the release
        if: steps.tagged.outputs.exists == 'false'
        run: |
          git config user.email "ci@rrequest.dev"
          git config user.name "rrequest ci"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
